name: Validate OpenAPI M9

on:
  pull_request:
    branches: 
      - main
    paths:
      - '/contratos/m9_reservas/**' 
  push:
    branches: 
      - main
jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install swagger-cli
        run: npm install -g @apidevtools/swagger-cli

      - name: Validate M9 OpenAPI definition
        run: swagger-cli validate ./contratos/m9_reservas/openapi.yml
